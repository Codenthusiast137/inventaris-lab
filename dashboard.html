<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabInventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true" data-soft></canvas>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">LabInventory</div>
      <nav id="nav" aria-label="Menu utama"></nav>
      <div class="me">
        <div class="me-info">
          <strong id="me-name"></strong>
          <span id="me-role" class="role"></span>
        </div>
        <button id="logout" type="button">Keluar</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" type="button" aria-label="Buka menu">Menu</button>
        <h1 id="page-title">Dashboard</h1>
      </header>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/barang.js"></script>
  <script src="js/views/peminjaman.js"></script>
  <script src="js/views/pengembalian.js"></script>
  <script src="js/views/riwayat.js"></script>
  <script src="js/views/pengguna.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
