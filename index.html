<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · LabInventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="stage">
  <main class="card">
    <section class="form-side">
      <svg class="mascot" id="mascot" viewBox="0 0 70 50" width="84" height="60" aria-hidden="true">
        <rect x="2" y="4" width="66" height="44" rx="14" fill="#f4623a"/>
        <circle cx="23" cy="22" r="10" fill="#fff"/><circle cx="47" cy="22" r="10" fill="#fff"/>
        <circle class="pup" cx="23" cy="22" r="4.5" fill="#1f2430"/><circle class="pup" cx="47" cy="22" r="4.5" fill="#1f2430"/>
        <rect class="lid" x="12" y="11" width="22" height="22" rx="10" fill="#f4623a" stroke="#d6342a"/>
        <rect class="lid" x="36" y="11" width="22" height="22" rx="10" fill="#f4623a" stroke="#d6342a"/>
        <path id="mouth" d="M28 39 Q35 44 42 39" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Masuk</h1>
      <p class="hint">Gunakan akun yang diberikan Admin.</p>

      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>

        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle-pw" class="ghost" aria-label="Tampilkan password">Lihat</button>
        </div>

        <p id="error" class="error" role="alert" aria-live="polite" hidden></p>

        <button type="submit" id="submit" class="primary">Masuk</button>
      </form>
    </section>

    <aside class="welcome-side" id="panel">
      <svg class="fl a" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <svg class="fl b" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 3v6"/></svg>
      <svg class="fl c" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="9" rx="2"/><circle cx="16" cy="12.5" r="2.5"/><path d="M6 17v2M18 17v2"/></svg>
      <svg class="fl d" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      <svg class="icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/>
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
      </svg>
      <h2 id="panel-title">Selamat datang di LabInventory</h2>
      <p id="panel-text">Kelola inventaris dan peminjaman barang laboratorium dalam satu tempat.</p>
    </aside>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
